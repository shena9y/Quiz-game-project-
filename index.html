<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen shadow-sm active" id="start-screen">
        <h1>Quiz Time!</h1>
        <p>Test your knowledge with this fun questions</p>
        <button id="start-btn" class="btn btn-primary">Start Quiz</button>
      </div>
      <div class="screen shadow-lg " id="quiz-screen">
        <div class="quiz-header">
          <h2 id="question-text">Question goes here</h2>
          <div class="quiz-info">
            <p>
              Question <span id="current-question">1</span>of <span id="max-question">5</span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
        </div>
        <div id="answers-container" class="answers-container">
          <!-- answers buttons will be inserted by javascript in latter some point -->
          
        </div>
        <div class="progress-bar">
          <div id="progress" class="progress"></div>
        </div>
      </div>
      <div class="screen shadow-lg "  id="result-screen">
        <h1>Quiz Results</h1>
        <div class="result-info">
          <p>
            You scored <span id="final-score">0</span>out of
            <span id="max-score">5</span>
            <div id="result-message">Good job</div>
            <button id="restart-btn" class="btn btn-danger mt-3">Restart Quiz</button>
          </p>
        </div>
      </div>
    </div>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
